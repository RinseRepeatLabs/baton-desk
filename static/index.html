<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Baton desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2310211c' width='32' height='32' rx='6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e0b089'/%3E%3C/svg%3E">
</head>
<body>
  <header class="mast">
    <p class="eyebrow">TimeFlow · session relay</p>
    <div class="mast-row">
      <h1>Baton desk</h1>
      <p class="lede">The last note in a thread says who the work waits on. Linux, the kitchen Mac, and you, on one desk.</p>
    </div>
    <p class="meta" id="meta">Reading the relay…</p>
  </header>

  <main class="sheet">
    <section class="stations" id="stations" aria-label="Who holds the baton"></section>

    <section class="work">
      <div class="index">
        <div class="index-bar">
          <div class="filters" id="filters" role="tablist" aria-label="Whose queue">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="linux">Linux</button>
            <button type="button" data-filter="mac">Mac</button>
            <button type="button" data-filter="ian">Ian</button>
            <button type="button" data-filter="none">Settled</button>
          </div>
          <label class="search">
            <span class="visually-hidden">Search threads</span>
            <input id="search" type="search" placeholder="Search threads" autocomplete="off">
          </label>
        </div>
        <div id="threads" class="threads" role="list"></div>
      </div>
      <article class="transcript" id="transcript" aria-live="polite">
        <p class="quiet">Choose a thread.</p>
      </article>
    </section>

    <section class="river" id="protocol" aria-label="Coordinator protocol"></section>
  </main>

  <!-- board -->
  <script src="/app.js"></script>
</body>
</html>
